name: fraud-monitoring-dev

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile.dev
    env_file:
      - .env
    environment:
      PORT: 6060
    ports:
      - "6060:6060"
    volumes:
      - ./backend:/workspace/backend
      - /workspace/node_modules
    command: npm run start:dev --workspace backend

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile.dev
    env_file:
      - .env
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:6060/api}
    ports:
      - "7070:7070"
    volumes:
      - ./frontend:/workspace/frontend
      - /workspace/node_modules
    depends_on:
      - backend
    command: npm run dev --workspace frontend

# Development only. Branch databases and upstream services remain external.
